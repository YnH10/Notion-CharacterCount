<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>글자수 계산기</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-6: 1.5rem; --space-8: 2rem;
  --radius-md: 0.5rem; --radius-lg: 0.75rem; --radius-xl: 1rem;
  --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --bg: #f7f6f2; --surface: #f9f8f5; --surface-2: #fbfbf9;
  --border: #d4d1ca; --divider: #dcd9d5;
  --text-c: #28251d; --text-muted: #7a7974; --text-faint: #bab9b4;
  --primary: #01696f; --primary-hover: #0c4e54;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
}
[data-theme="dark"] {
  --bg: #171614; --surface: #1c1b19; --surface-2: #201f1d;
  --border: #393836; --divider: #262523;
  --text-c: #cdccca; --text-muted: #797876; --text-faint: #5a5957;
  --primary: #4f98a3; --primary-hover: #227f8b;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme]) {
  --bg: #171614; --surface: #1c1b19; --surface-2: #201f1d;
  --border: #393836; --divider: #262523;
  --text-c: #cdccca; --text-muted: #797876; --text-faint: #5a5957;
  --primary: #4f98a3; --primary-hover: #227f8b;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.2);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.3);
}}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; }
body {
  min-height: 100dvh; font-family: 'Satoshi', sans-serif;
  font-size: var(--text-base); color: var(--text-c);
  background: var(--bg); display: flex; flex-direction: column;
  align-items: center; padding: var(--space-8) var(--space-4);
}
header {
  width: 100%; max-width: 720px;
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: var(--space-6);
}
.logo { display: flex; align-items: center; gap: var(--space-2); }
.logo svg { color: var(--primary); }
.logo-text { font-size: var(--text-lg); font-weight: 700; color: var(--text-c); }
.theme-btn {
  background: none; border: 1px solid var(--border);
  color: var(--text-muted); border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3); cursor: pointer;
  display: flex; align-items: center; gap: var(--space-1);
  font-size: var(--text-sm);
  transition: color var(--transition), background var(--transition);
}
.theme-btn:hover { color: var(--text-c); background: var(--surface-2); }
.card {
  width: 100%; max-width: 720px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: var(--space-6);
  box-shadow: var(--shadow-md);
}
textarea {
  width: 100%; min-height: 220px; resize: vertical;
  background: var(--bg); color: var(--text-c);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: var(--space-4); font-family: inherit; font-size: var(--text-base);
  line-height: 1.7; outline: none; margin-bottom: var(--space-4);
  transition: border-color var(--transition), box-shadow var(--transition);
}
textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in oklab, var(--primary) 15%, transparent); }
textarea::placeholder { color: var(--text-faint); }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: var(--space-3); margin-bottom: var(--space-4);
}
.stat-card {
  background: var(--surface-2); border: 1px solid var(--divider);
  border-radius: var(--radius-lg); padding: var(--space-4);
  display: flex; flex-direction: column; gap: var(--space-1);
}
.stat-label { font-size: var(--text-xs); color: var(--text-muted); font-weight: 500; }
.stat-value {
  font-size: var(--text-lg); font-weight: 700; color: var(--primary);
  font-variant-numeric: tabular-nums;
}
.stat-value.bump { animation: bump 0.18s ease-out; }
@keyframes bump { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
hr { border: none; border-top: 1px solid var(--divider); margin: var(--space-4) 0; }
.actions { display: flex; gap: var(--space-3); flex-wrap: wrap; }
.btn {
  padding: var(--space-2) var(--space-4); border-radius: var(--radius-md);
  font-size: var(--text-sm); font-weight: 500; cursor: pointer;
  border: 1px solid transparent;
  transition: background var(--transition), color var(--transition);
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: none; border-color: var(--border); color: var(--text-muted); }
.btn-ghost:hover { background: var(--surface-2); color: var(--text-c); }
.hint { font-size: var(--text-xs); color: var(--text-faint); margin-top: var(--space-2); }
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="3"/>
      <path d="M7 8h10M7 12h6M7 16h4"/>
    </svg>
    <span class="logo-text">글자수 계산기</span>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="테마 전환">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    테마
  </button>
</header>

<div class="card">
  <textarea id="input" placeholder="여기에 텍스트를 입력하세요…" spellcheck="false"></textarea>
  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">글자수 (공백 포함)</span>
      <span class="stat-value" id="s-total">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">글자수 (공백 제외)</span>
      <span class="stat-value" id="s-nospace">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">단어수</span>
      <span class="stat-value" id="s-words">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">줄 수</span>
      <span class="stat-value" id="s-lines">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">문장수</span>
      <span class="stat-value" id="s-sentences">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">바이트 (UTF-8)</span>
      <span class="stat-value" id="s-bytes">0</span>
    </div>
  </div>
  <hr>
  <div class="actions">
    <button class="btn btn-primary" onclick="copyStats()">통계 복사</button>
    <button class="btn btn-ghost" onclick="clearAll()">초기화</button>
  </div>
  <p class="hint">입력과 동시에 실시간으로 자동 계산됩니다.</p>
</div>

<script>
(function(){
  const html = document.documentElement;
  let theme = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  html.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').addEventListener('click', () => {
    theme = theme === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', theme);
  });
})();

const input = document.getElementById('input');
const g = id => document.getElementById(id);

function bump(el, val) {
  el.textContent = val;
  el.classList.remove('bump');
  void el.offsetWidth;
  el.classList.add('bump');
}

function countSentences(s) {
  const t = s.trim();
  if (!t) return 0;
  const m = t.match(/[^.!?]*[.!?]+/g);
  return m ? m.length : (t.length > 0 ? 1 : 0);
}

function utf8Bytes(s) {
  return new TextEncoder().encode(s).length;
}

input.addEventListener('input', () => {
  const v = input.value;
  bump(g('s-total'), v.length);
  bump(g('s-nospace'), v.replace(/\s/g, '').length);
  bump(g('s-words'), v.trim() === '' ? 0 : v.trim().split(/\s+/).length);
  bump(g('s-lines'), v === '' ? 0 : v.split('\n').length);
  bump(g('s-sentences'), countSentences(v));
  bump(g('s-bytes'), utf8Bytes(v));
});

function copyStats() {
  const v = input.value;
  const t = [
    '글자수(공백 포함): ' + v.length,
    '글자수(공백 제외): ' + v.replace(/\s/g, '').length,
    '단어수: ' + (v.trim() === '' ? 0 : v.trim().split(/\s+/).length),
    '줄 수: ' + (v === '' ? 0 : v.split('\n').length),
    '문장수: ' + countSentences(v),
    '바이트(UTF-8): ' + utf8Bytes(v),
  ].join('\n');
  navigator.clipboard.writeText(t).catch(() => {});
}

function clearAll() {
  input.value = '';
  ['s-total','s-nospace','s-words','s-lines','s-sentences','s-bytes'].forEach(id => g(id).textContent = '0');
  input.focus();
}
</script>
</body>
</html>
