<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>글자수세기</title>
<style>
:root {
  --bg: #ffffff;
  --card: #fafafa;
  --panel: #ffffff;
  --line: #e9e9e7;
  --line-2: #efefed;
  --text: #222222;
  --muted: #8a8a8a;
  --blue: #4f7df3;
  --shadow: 0 0 0 1px rgba(0,0,0,0.02);
  --radius-xl: 22px;
  --radius-lg: 16px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
body{padding:22px}
.wrap{
  max-width:1080px;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:28px;
  box-shadow: var(--shadow);
  padding:28px 28px 20px;
}
.title{
  font-size:28px;
  font-weight:800;
  margin:0 0 24px;
  letter-spacing:-0.02em;
}
.panel{
  border:1px solid var(--line);
  border-radius:18px;
  background:var(--panel);
  overflow:hidden;
}
.editor{
  width:100%;
  min-height:300px;
  border:0;
  resize:vertical;
  outline:none;
  display:block;
  padding:28px;
  font-size:24px;
  line-height:1.75;
  color:var(--text);
}
.editor::placeholder{color:#b8b8b8}
.bottom{
  display:grid;
  grid-template-columns: 1fr 1fr;
  border-top:1px solid var(--line-2);
}
.metric{
  padding:22px 28px 24px;
  min-height:116px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.metric-label{
  font-size:22px;
  font-weight:800;
  margin-bottom:8px;
  letter-spacing:-0.02em;
}
.metric-row{
  display:flex;
  align-items:baseline;
  gap:14px;
}
.metric-num{
  font-size:58px;
  line-height:1;
  color:var(--blue);
  font-weight:500;
  letter-spacing:-0.04em;
}
.metric-byte{
  font-size:22px;
  color:#666;
}
.metric + .metric{border-left:1px solid var(--line-2)}
@media (max-width: 720px){
  body{padding:14px}
  .wrap{padding:18px 18px 16px;border-radius:22px}
  .title{font-size:24px;margin-bottom:18px}
  .editor{min-height:220px;padding:20px;font-size:20px}
  .bottom{grid-template-columns:1fr}
  .metric + .metric{border-left:0;border-top:1px solid var(--line-2)}
  .metric{min-height:96px;padding:18px 20px}
  .metric-label{font-size:18px}
  .metric-num{font-size:44px}
  .metric-byte{font-size:18px}
}
</style>
</head>
<body>
  <main class="wrap">
    <h1 class="title">글자수세기</h1>
    <section class="panel">
      <textarea id="text" class="editor" spellcheck="false" autocorrect="off" autocomplete="off" autocapitalize="off" placeholder="여기에 글을 입력하세요"></textarea>
      <div class="bottom">
        <div class="metric">
          <div class="metric-label">공백포함</div>
          <div class="metric-row">
            <span id="withSpace" class="metric-num">0</span>
            <span id="withByte" class="metric-byte">0 byte</span>
          </div>
        </div>
        <div class="metric">
          <div class="metric-label">공백제외</div>
          <div class="metric-row">
            <span id="withoutSpace" class="metric-num">0</span>
            <span id="withoutByte" class="metric-byte">0 byte</span>
          </div>
        </div>
      </div>
    </section>
  </main>
<script>
const text = document.getElementById('text');
const withSpace = document.getElementById('withSpace');
const withoutSpace = document.getElementById('withoutSpace');
const withByte = document.getElementById('withByte');
const withoutByte = document.getElementById('withoutByte');
const encoder = new TextEncoder();

function bytesOf(str){
  return encoder.encode(str).length;
}

function updateCounts(){
  const value = text.value;
  const noSpace = value.replace(/\s/g, '');
  withSpace.textContent = value.length.toLocaleString('ko-KR');
  withoutSpace.textContent = noSpace.length.toLocaleString('ko-KR');
  withByte.textContent = `${bytesOf(value).toLocaleString('ko-KR')} byte`;
  withoutByte.textContent = `${bytesOf(noSpace).toLocaleString('ko-KR')} byte`;
}

text.addEventListener('input', updateCounts);
updateCounts();
</script>
</body>
</html>
